name: Update Short Interest Monitor

on:
  schedule:
    - cron: '0 14 10,25 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create folder structure
        run: mkdir -p data/raw data/processed data/history data/latest data/cache docs logs

      - name: Run pipeline
        run: python pipeline/run_pipeline.py

      - name: Commit & push updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --cached --quiet && echo "Sin cambios" || \
            git commit -m "chore: short interest update $(date -u +%Y-%m-%d)"
          git push